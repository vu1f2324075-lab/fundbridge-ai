# Render Blueprint — FundBridge AI
#
# Deploys the API only.
#
#   fundbridge-api   Node/Express API   (web service)
#
# The frontend is a static bundle and is deployed on Vercel instead — see
# docs/DEPLOYMENT.md, and vercel.json in this directory. The API cannot move
# to Vercel with it: Vercel runs serverless functions that are frozen between
# requests, and this process holds a Prisma connection pool and an in-process
# rate-limit store that both assume it stays alive.
#
# The Python AI service is NOT deployed here. The API treats it as optional:
# with AI_SERVICE_URL blank, document extraction and the assistant are disabled
# and every deterministic engine — readiness, scheme matching, investor
# matching — keeps working. Deploying it needs the ONNX embedding migration
# first, because the sentence-transformers virtualenv is ~1.5GB and will not fit
# a free instance.
#
# ---------------------------------------------------------------------------
# What you must supply by hand
#
# Two values are marked `sync: false`, which means Render prompts for them and
# never stores them in this file:
#
#   DATABASE_URL     the Neon connection string, POOLED variant, with
#                    ?sslmode=require appended
#   VITE_API_BASE_URL the API's public URL + /api, known only after the first
#                    deploy (see the note on that variable below)
#
# JWT_SECRET is generated by Render itself, so no secret is ever written here
# or pasted through a terminal.
#
# ---------------------------------------------------------------------------
# Known limitation of this configuration: uploaded files
#
# STORAGE_ALLOW_EPHEMERAL is true below, which lets the API boot with the local
# storage driver. That is deliberate so the first deploy succeeds with no extra
# accounts — but a Render container's filesystem is replaced on every deploy
# and every restart, so uploaded proposal PDFs are lost while their database
# rows survive, pointing at files that are gone.
#
# Fine for a first look. Before this is used for anything real, create a
# Cloudflare R2 bucket and switch the five S3_* variables noted further down.

services:
  # -------------------------------------------------------------------------
  - type: web
    name: fundbridge-api
    runtime: node
    plan: free
    region: singapore
    # Closest region to India of those Render offers on the free plan.

    # `--include=dev` is load-bearing, not caution. NODE_ENV=production is set
    # below, and under it `npm ci` omits devDependencies — which here means no
    # typescript and no prisma CLI, so the build fails and `migrate deploy`
    # has nothing to run.
    #
    # `npm ci` also triggers the backend's postinstall, `prisma generate`.
    # Generation reads the schema but opens no connection, so it is safe at
    # build time, before DATABASE_URL has ever been dialled.
    buildCommand: npm ci --include=dev && npm run build --workspace backend

    # Migrations run here rather than in a preDeployCommand, which Render only
    # offers on paid instance types. `migrate deploy` is idempotent, so running
    # it again on each restart applies nothing and costs a round trip.
    startCommand: npm run db:deploy --workspace backend && node backend/dist/index.js

    # Mounted before rate limiting in app.ts, so health checks are never
    # throttled.
    healthCheckPath: /api/health

    envVars:
      - key: NODE_ENV
        value: production

      # Render injects PORT and expects the process to bind it.
      - key: PORT
        value: 10000

      # Generated by Render and never shown in this file or in a shell.
      # env.ts refuses to start in production if this is a known placeholder.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 7d

      # Neon. Use the POOLED connection string (it contains `-pooler`): a free
      # instance opens more connections than Neon's direct endpoint allows.
      # Append ?sslmode=require.
      - key: DATABASE_URL
        sync: false

      # The frontend is deployed on Vercel (see docs/DEPLOYMENT.md), so this
      # cannot be wired with fromService. Set it to the Vercel URL with no
      # trailing slash, for example https://fundbridge-ai.vercel.app, and
      # redeploy. env.ts rejects a wildcard or a localhost origin in
      # production.
      - key: CORS_ORIGIN
        sync: false

      # Render terminates TLS and forwards X-Forwarded-For. Without this,
      # req.ip is the load balancer and rate limiting buckets every client
      # together.
      - key: TRUST_PROXY
        value: 'true'

      # The frontend and the API are separate *.onrender.com subdomains, and
      # onrender.com is on the Public Suffix List — so they are different
      # SITES. A SameSite=Lax cookie is not sent cross-site, so with 'lax' here
      # login would succeed and every request after it would arrive
      # unauthenticated, with no error anywhere. See config/cookies.ts.
      - key: COOKIE_SAMESITE
        value: none

      # See the limitation note at the top of this file.
      - key: STORAGE_DRIVER
        value: local
      - key: STORAGE_ALLOW_EPHEMERAL
        value: 'true'
      - key: STORAGE_LOCAL_DIR
        value: ./storage/proposals

      # To move uploads to Cloudflare R2, set STORAGE_DRIVER=s3 above, drop
      # STORAGE_ALLOW_EPHEMERAL, and add these five in the Render dashboard:
      #
      #   S3_BUCKET             bucket name
      #   S3_ENDPOINT           https://<account-id>.r2.cloudflarestorage.com
      #   S3_ACCESS_KEY_ID      R2 API token access key
      #   S3_SECRET_ACCESS_KEY  R2 API token secret
      #   S3_REGION             auto
      #
      # Keep the bucket private. The API streams bytes through its own
      # authenticated, ownership-checked download route and issues no
      # presigned URLs.

      # Blank disables the AI service. Deterministic scoring is unaffected.
      - key: AI_SERVICE_URL
        value: ''

      - key: LOG_LEVEL
        value: info

      # Pinned so a Render default bump cannot change the runtime underneath a
      # working deploy. 22 is the current LTS and satisfies engines (>=20).
      - key: NODE_VERSION
        value: '22'
